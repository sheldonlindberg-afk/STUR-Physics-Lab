<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STUR Experimental Geometry Matcher</title>

<style>
:root{
  --bg:#050814;
  --panel:#0a1022;
  --border:#1f2a44;
  --text:#e6edf3;
  --muted:#94a3b8;
  --accent:#60a5fa;
  --accent2:#34d399;
  --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  --sans: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:linear-gradient(180deg,#030510,#050814);
  color:var(--text);
  font-family:var(--sans);
  padding:20px;
}
.wrap{max-width:1400px;margin:auto}
h1{margin:0 0 6px}
.subtitle{color:var(--muted);font-size:13px;margin-bottom:18px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1100px){.grid{grid-template-columns:1fr}}

.card{
  background:rgba(10,16,34,.85);
  border:1px solid rgba(255,255,255,.08);
  border-radius:14px;
  padding:16px;
}

.cardtitle{
  font-size:12px;
  font-weight:800;
  color:#cbd5e1;
  text-transform:uppercase;
  letter-spacing:.3px;
  margin-bottom:12px;
  border-bottom:1px solid rgba(255,255,255,.08);
  padding-bottom:8px;
}

.param{margin-bottom:12px}
.param label{
  font-size:12px;
  font-weight:700;
  color:#dbeafe;
}
.param .row{
  display:flex;
  gap:8px;
  margin-top:6px;
}
.param input[type=range]{flex:1}
.param input[type=number]{
  width:110px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  color:var(--text);
  border-radius:8px;
  padding:6px;
  font-family:var(--mono);
}

.metric{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  border-radius:12px;
  padding:12px;
  margin-bottom:10px;
}
.metric .label{font-size:11px;color:var(--muted)}
.metric .value{
  font-family:var(--mono);
  font-size:20px;
  font-weight:800;
  margin-top:4px;
}

canvas{
  width:100%;
  border-radius:12px;
  margin-top:10px;
  background:rgba(255,255,255,.03);
}

.export-btn{
  width:100%;
  padding:12px;
  border-radius:12px;
  background:rgba(52,211,153,.18);
  border:1px solid rgba(52,211,153,.35);
  color:#dcfce7;
  font-weight:800;
  cursor:pointer;
}
.export-btn:hover{background:rgba(52,211,153,.28)}
</style>
</head>

<body>
<div class="wrap">
<h1>STUR Experimental Geometry Matcher</h1>
<div class="subtitle">
Interactive, domain-locked predictions • QM vs STUR • Fully self-contained
</div>

<div class="grid">

<!-- INPUTS -->
<div class="card">
<div class="cardtitle">Experimental Geometry</div>

<div class="param">
<label>Wavelength λ (nm)</label>
<div class="row">
<input id="lambdaR" type="range" min="200" max="800" step="1" value="500">
<input id="lambdaN" type="number" value="500">
</div>
</div>

<div class="param">
<label>Slit Width a (μm)</label>
<div class="row">
<input id="aR" type="range" min="10" max="200" step="1" value="100">
<input id="aN" type="number" value="100">
</div>
</div>

<div class="param">
<label>Slit Separation d (μm)</label>
<div class="row">
<input id="dR" type="range" min="100" max="3000" step="10" value="1000">
<input id="dN" type="number" value="1000">
</div>
</div>

<div class="param">
<label>Screen Distance L (cm)</label>
<div class="row">
<input id="LR" type="range" min="10" max="300" step="5" value="100">
<input id="LN" type="number" value="100">
</div>
</div>

<div class="cardtitle">STUR Parameters</div>

<div class="param">
<label>R<sub>q</sub></label>
<div class="row">
<input id="rqR" type="range" min="0" max="2.5" step="0.05" value="1.8">
<input id="rqN" type="number" step="0.05" value="1.8">
</div>
</div>

<div class="param">
<label>L₀ (nm)</label>
<div class="row">
<input id="l0R" type="range" min="10" max="500" step="5" value="120">
<input id="l0N" type="number" value="120">
</div>
</div>

<button class="export-btn" onclick="exportJSON()">📊 Export Predictions JSON</button>
</div>

<!-- OUTPUTS -->
<div class="card">
<div class="cardtitle">Predicted Observables</div>

<div class="metric"><div class="label">Visibility (QM)</div><div class="value" id="vQM">—</div></div>
<div class="metric"><div class="label">Visibility (STUR)</div><div class="value" id="vST">—</div></div>
<div class="metric"><div class="label">Δ Visibility</div><div class="value" id="vDV">—</div></div>
<div class="metric"><div class="label">Coherence Length ℓ<sub>coh</sub></div><div class="value" id="ell">—</div></div>
<div class="metric"><div class="label">Decoherence Time τ</div><div class="value" id="tau">—</div></div>
<div class="metric"><div class="label">Max |ΔI|</div><div class="value" id="maxdev">—</div></div>

<canvas id="plot" width="900" height="360"></canvas>
</div>

</div>
</div>

<script>
/* === Canonical Operators === */
const S_u = u => Math.tanh(u)*(1-Math.exp(-u));
const sinc = x => Math.abs(x)<1e-12 ? 1 : Math.sin(Math.PI*x)/(Math.PI*x);

/* === Constants === */
const Y_HALF=0.025, C=299792458;

/* === Sync === */
[['lambdaR','lambdaN'],['aR','aN'],['dR','dN'],['LR','LN'],['rqR','rqN'],['l0R','l0N']]
.forEach(([r,n])=>{
  const R=document.getElementById(r),N=document.getElementById(n);
  R.oninput=()=>{N.value=R.value;compute()}
  N.oninput=()=>{R.value=N.value;compute()}
});

function compute(){
  const λ=+lambdaN.value*1e-9,a=+aN.value*1e-6,d=+dN.value*1e-6;
  const L=+LN.value*1e-2,Rq=+rqN.value,L0=+l0N.value*1e-9;

  const N=501,y=[],yMM=[],Iq=[],Is=[];
  let maxDev=0;

  for(let i=0;i<N;i++){
    const yy=-Y_HALF+2*Y_HALF*i/(N-1);
    const env=sinc(a*yy/(λ*L))**2;
    const φ=(2*Math.PI/λ)*(d*yy/L);
    const u=Math.abs(d*yy/L)/Math.max(L0,1e-30);
    const rs=Rq*S_u(u);
    const coh=Math.exp(-rs);
    const damp=Math.exp(-0.5*rs*rs);
    Iq.push(env*Math.cos(φ/2)**2);
    Is.push(2*env*coh**2*(1+Math.cos(φ)*damp));
    y.push(yy); yMM.push(yy*1000);
  }

  const norm=a=>{const m=Math.max(...a);return a.map(v=>v/m)}
  const Q=norm(Iq),S=norm(Is);

  const vis=a=>{
    const c=a.filter((_,i)=>Math.abs(yMM[i])<2);
    const M=Math.max(...c),m=Math.min(...c);
    return M+m>0?(M-m)/(M+m):0;
  };

  const vQM=vis(Q),vST=vis(S);
  vQM_el.textContent=vQM.toFixed(4);
  vST_el.textContent=vST.toFixed(4);
  vDV_el.textContent=(vST-vQM).toFixed(4);

  let ucoh=Infinity;
  for(let u=0;u<50;u+=0.001){if(Rq*S_u(u)>=1){ucoh=u;break}}
  const ell=ucoh===Infinity?Infinity:L*L0/d*ucoh;
  ell_el.textContent=ell===Infinity?'∞':(ell*1000).toFixed(3)+' mm';
  tau_el.textContent=ell===Infinity?'∞':(ell/C*1e15).toFixed(2)+' fs';

  S.forEach((v,i)=>maxDev=Math.max(maxDev,Math.abs(v-Q[i])));
  maxdev_el.textContent=maxDev.toFixed(4);

  drawPlot(yMM,Q,S);
}

/* === Plot === */
function drawPlot(x,q,s){
  const c=plot,ctx=c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  const pad=50,w=c.width-pad*2,h=c.height-pad*2;
  const xmin=Math.min(...x),xmax=Math.max(...x);
  const ymin=0,ymax=1;
  const mapX=v=>pad+(v-xmin)*w/(xmax-xmin);
  const mapY=v=>pad+h*(1-(v-ymin)/(ymax-ymin));

  ctx.strokeStyle='#2563eb';ctx.beginPath();
  x.forEach((v,i)=>{const X=mapX(v),Y=mapY(q[i]);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});ctx.stroke();

  ctx.strokeStyle='#059669';ctx.setLineDash([6,4]);ctx.beginPath();
  x.forEach((v,i)=>{const X=mapX(v),Y=mapY(s[i]);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});ctx.stroke();
  ctx.setLineDash([]);
}

/* === Export === */
function exportJSON(){
  const data={
    parameters:{
      lambda_nm:+lambdaN.value,slit_width_um:+aN.value,
      slit_sep_um:+dN.value,L_cm:+LN.value,Rq:+rqN.value,L0_nm:+l0N.value
    },
    observables:{
      visibility_qm:parseFloat(vQM_el.textContent),
      visibility_stur:parseFloat(vST_el.textContent),
      delta_visibility:parseFloat(vDV_el.textContent),
      coherence_length_mm:ell_el.textContent,
      decoherence_time_fs:tau_el.textContent,
      max_deltaI:parseFloat(maxdev_el.textContent)
    },
    provenance:{
      Su:"tanh(u)*(1-exp(-u))",
      Iq:"env*cos(phi/2)^2",
      Is:"2*env*coh^2*(1+cos(phi)*damp)",
      domain:"y ∈ [-0.025,0.025] m, N=501"
    }
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='stur_predictions.json';
  a.click();
}

/* Bind outputs */
const vQM_el=vQM,vST_el=vST,vDV_el=vDV,ell_el=ell,tau_el=tau,maxdev_el=maxdev;
compute();
</script>
</body>
</html>
