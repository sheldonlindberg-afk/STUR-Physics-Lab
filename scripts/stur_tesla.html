<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>STUR–TOE + Chronomagnetics Simulator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- Tailwind (matches your lab aesthetic) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- React + ReactDOM (UMD) -->
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

<!-- Recharts (UMD) -->
<script src="https://unpkg.com/recharts/umd/Recharts.min.js"></script>

<!-- Babel (JSX in browser) -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  body {
    margin: 0;
    background: #020617;
    color: #e5e7eb;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  }
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

const {
  LineChart, Line, XAxis, YAxis, CartesianGrid,
  Tooltip, Legend, ResponsiveContainer,
  ScatterChart, Scatter, ReferenceLine, ReferenceArea
} = Recharts;

const { useState, useMemo } = React;

/* ============================================================
   STUR–TOE + CHRONOMAGNETICS SIMULATOR
   Single-file GitHub Pages version
   ============================================================ */

function STURChronoAnalyzer() {

  /* ---------- UI State ---------- */
  const [RqManual, setRqManual] = useState(1.8);
  const [L0_nm, setL0nm] = useState(120);
  const [viewMode, setViewMode] = useState("pattern");
  const [showDiff, setShowDiff] = useState(false);
  const [timeTravel, setTimeTravel] = useState(false);
  const [tau, setTau] = useState(1.0);

  /* ---------- Constants ---------- */
  const RQ_MAX = 2.5;
  const LAM = 500e-9;
  const L = 1.0;
  const a = 100e-6;
  const d = 1e-3;

  /* ---------- Physics ---------- */
  const S_u = (u) => Math.tanh(u) * (1 - Math.exp(-u));
  const sinc_pi = (x) => Math.abs(x) < 1e-12 ? 1 : Math.sin(Math.PI*x)/(Math.PI*x);

  const normalize = (arr) => {
    const m = Math.max(...arr);
    return arr.map(v => v/(m||1));
  };

  /* ---------- Time-Travel → Rq ---------- */
  const Rq = useMemo(() => {
    if (!timeTravel) return RqManual;
    const log_t0 = -43.27, log_t1 = 17.6;
    const log_t = (1-tau)*log_t0 + tau*log_t1;
    const t_eff = Math.pow(10, log_t);
    const u_c = Math.log(t_eff/1e-43);
    return RQ_MAX * S_u(Math.abs(u_c));
  }, [RqManual, timeTravel, tau]);

  /* ---------- Epoch Markers ---------- */
  const cosmicEvents = [
    { name:"CMB", log_t:12.6, color:"#90ee90", desc:"Recombination" },
    { name:"Dark Ages", log_t:15.5, color:"#4169e1", desc:"No stars" },
    { name:"Reion.", log_t:16.3, color:"#9370db", desc:"First galaxies" },
    { name:"Now", log_t:17.6, color:"#ffffff", desc:"Present" }
  ];

  /* ---------- Core Computation ---------- */
  const patterns = useMemo(() => {
    const L0 = L0_nm*1e-9;
    const y = Array.from({length:501},(_,i)=>(i-250)*1e-4);
    const y_mm = y.map(v=>v*1000);

    const env = y.map(yy=>Math.pow(sinc_pi((a*yy)/(LAM*L)),2));
    const phi = y.map(yy=>(2*Math.PI/LAM)*(d*yy/L));

    const I_qm = y.map((_,i)=>env[i]*Math.cos(phi[i]/2)**2);

    const coh = y.map(yy=>{
      const u = Math.abs(d*yy/L)/Math.max(L0,1e-30);
      return Math.exp(-Rq*S_u(u));
    });

    const damp = y.map(yy=>{
      const u = Math.abs(d*yy/L)/Math.max(L0,1e-30);
      return Math.exp(-0.5*(Rq*S_u(u))**2);
    });

    const I_stur = y.map((_,i)=>
      2*env[i]*coh[i]*coh[i]*(1+Math.cos(phi[i])*damp[i])
    );

    const Iq = normalize(I_qm);
    const Is = normalize(I_stur);
    const diff = Is.map((v,i)=>v-Iq[i]);

    const rmse = Math.sqrt(diff.reduce((s,d)=>s+d*d,0)/diff.length);

    const entropy = coh.reduce((s,c)=>s+(1-c),0)/coh.length;
    const bitsLost = entropy*1.442695;

    const t_eff = Math.pow(10,14+Rq*2.5);
    const log_t = Math.log10(t_eff);
    const M = Rq*S_u(Math.log(t_eff/1e-43));

    return {
      y_mm, Iq, Is, diff, rmse,
      bitsLost, log_t, M
    };
  }, [Rq, L0_nm]);

  /* ---------- Charts ---------- */
  const chartData = patterns.y_mm.map((y,i)=>({
    y:y.toFixed(2),
    QM:patterns.Iq[i],
    STUR:patterns.Is[i],
    Diff:patterns.diff[i]*1000
  }));

  /* ---------- Render ---------- */
  return (
    <div className="max-w-7xl mx-auto p-6 space-y-6">

      <h1 className="text-3xl font-bold text-indigo-400">
        STUR–TOE + Chronomagnetics Simulator
      </h1>

      {/* Controls */}
      <div className="grid md:grid-cols-4 gap-4 bg-slate-800 p-4 rounded">
        <div>
          <label className="text-sm">R<sub>q</sub></label>
          <input type="range" min="0.2" max="2.5" step="0.05"
            value={RqManual}
            disabled={timeTravel}
            onChange={e=>setRqManual(+e.target.value)}
            className="w-full"/>
          <div className="text-xs">Rq = {Rq.toFixed(3)}</div>
        </div>

        <div>
          <label className="text-sm">L<sub>0</sub> (nm)</label>
          <input type="range" min="50" max="500" step="10"
            value={L0_nm}
            onChange={e=>setL0nm(+e.target.value)}
            className="w-full"/>
          <div className="text-xs">{L0_nm} nm</div>
        </div>

        <div>
          <label className="text-sm">Time-Travel</label>
          <input type="checkbox" checked={timeTravel}
            onChange={()=>setTimeTravel(!timeTravel)}/>
          {timeTravel &&
            <input type="range" min="0" max="1" step="0.002"
              value={tau}
              onChange={e=>setTau(+e.target.value)}
              className="w-full mt-2"/>}
        </div>

        <div className="bg-black p-3 rounded font-mono">
          <div className="text-xs text-slate-400">Entropy Export</div>
          <div className="text-xl text-green-400">
            {patterns.bitsLost.toFixed(3)} bits
          </div>
        </div>
      </div>

      {/* Plot */}
      <ResponsiveContainer width="100%" height={380}>
        <LineChart data={chartData}>
          <CartesianGrid strokeDasharray="3 3"/>
          <XAxis dataKey="y"/>
          <YAxis/>
          <Tooltip/>
          <Legend/>
          {!showDiff ?
            <>
              <Line dataKey="QM" stroke="#3b82f6" dot={false}/>
              <Line dataKey="STUR" stroke="#22c55e" dot={false} strokeDasharray="5 5"/>
            </> :
            <Line dataKey="Diff" stroke="#a855f7" dot={false}/>
          }
        </LineChart>
      </ResponsiveContainer>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root"))
  .render(<STURChronoAnalyzer/>);

</script>
</body>
</html>
