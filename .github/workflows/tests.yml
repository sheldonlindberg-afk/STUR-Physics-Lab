name: Reproduce STUR-ROLL

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Regression and physics tests (output must match EXPECTED_OUTPUT exactly)
        run: python -m pytest tests/ -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Web simulator matches the Python roll
        run: node --test tests/web_sim.test.mjs
