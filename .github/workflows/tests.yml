name: Reproduce STUR

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Resistance equation (stur_verify.py output must match results/ exactly)
        run: python -m pytest tests/ -q
      - name: Archived STUR-ROLL regression and physics tests
        run: python -m pytest archive/stur-roll/tests/ -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Archived STUR-ROLL web simulator matches the Python roll
        run: node --test archive/stur-roll/tests/web_sim.test.mjs
