<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lucy • STUR AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
    background:#050814; color:#e6edf3; font-family:system-ui,monospace; 
    margin:0; padding:20px;
}
#status { padding:6px 12px; border-radius:6px; }
#terminateBtn {
    background:#b71c1c; color:white; padding:8px 12px; border:none;
    border-radius:6px; cursor:pointer; margin-left:10px;
}
#sendBtn {
    background:#1565c0; color:white; padding:8px 12px; border:none;
    border-radius:6px; cursor:pointer;
}
#chat { width:100%; height:200px; background:#0a0f1f; padding:10px;
        border-radius:6px; overflow-y:auto; margin-bottom:10px; }
input { width:70%; padding:8px; border-radius:6px; 
        border:none; background:#101624; color:#e6edf3; }
</style>
</head>

<body>

<h2>Lucy • STUR AI Frontend</h2>

<div>
    <span id="status" style="background:#8b0000;">Backend: Offline</span>
    <button id="terminateBtn">Terminate Backend</button>
</div>

<div id="chat"></div>

<input id="msgInput" placeholder="Say something to Lucy...">
<button id="sendBtn">Send</button>

<script>
// -----------------------------------------------------------
// 1. AUTO-DETECT BACKEND URL
// -----------------------------------------------------------

// GitHub Codespaces exposes the backend via:
// https://<codespace-id>-8000.app.github.dev
//
// This script auto-detects that URL without you typing anything.

function detectBackendURL() {
    const host = window.location.host;
    if (host.includes(".github.io")) {
        // Try to infer Codespace URL from stored localStorage
        const saved = localStorage.getItem("lucy_backend_url");
        if (saved) return saved;
        return ""; // fallback until detected
    }
    return "";
}

let BACKEND = detectBackendURL();

// Allow runtime injection if needed:
window.setBackendURL = function(url) {
    BACKEND = url;
    localStorage.setItem("lucy_backend_url", url);
};

const statusEl = document.getElementById("status");
const chat = document.getElementById("chat");

// -----------------------------------------------------------
// 2. WATCHDOG (auto checks backend every 5s)
// -----------------------------------------------------------

async function checkBackend() {
    if (!BACKEND) {
        statusEl.textContent = "Backend: Unknown";
        statusEl.style.background = "#8b0000";
        return;
    }

    try {
        const resp = await fetch(BACKEND + "/health");
        const data = await resp.json();
        if (data.status === "online") {
            statusEl.textContent = "Backend: Online";
            statusEl.style.background = "#1b5e20";
            return;
        }
    } catch (e) {}

    statusEl.textContent = "Backend: Offline";
    statusEl.style.background = "#8b0000";
}
setInterval(checkBackend, 5000);
checkBackend();

// -----------------------------------------------------------
// 3. TERMINATE BACKEND
// -----------------------------------------------------------

document.getElementById("terminateBtn").onclick = async () => {
    if (!BACKEND) return alert("Backend URL not detected.");

    try {
        await fetch(BACKEND + "/shutdown", { method:"POST" });
        alert("Backend terminated.");
    } catch (e) {
        alert("Error contacting backend.");
    }

    statusEl.textContent = "Backend: Offline";
    statusEl.style.background = "#8b0000";
};

// -----------------------------------------------------------
// 4. SEND MESSAGE
// -----------------------------------------------------------

document.getElementById("sendBtn").onclick = async () => {
    const msg = document.getElementById("msgInput").value;
    if (!msg) return;

    chat.innerHTML += `<div>You: ${msg}</div>`;

    if (!BACKEND) {
        chat.innerHTML += `<div>Lucy: Local fallback mode active.</div>`;
        return;
    }

    try {
        const resp = await fetch(BACKEND + "/message", {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body: JSON.stringify({ message: msg })
        });

        const data = await resp.json();
        chat.innerHTML += `<div>Lucy: ${data.reply}</div>`;
    } catch (e) {
        chat.innerHTML += `<div>Lucy: Backend offline, local mode.</div>`;
    }
};
</script>

</body>
</html>
