<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucy – STUR AI Interface</title>

<style>
  body {
    margin:0;
    padding:1rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:#050814;
    color:#e6edf3;
  }
  h1 {
    text-align:center;
    font-size:2rem;
    letter-spacing:3px;
    color:#ffaa00;
  }
  .panel {
    max-width:900px;
    margin:1rem auto;
    background:#0b1122;
    padding:1rem 1.4rem;
    border-radius:12px;
    border:1px solid #1a233b;
  }
  textarea, input {
    width:100%;
    background:#050a18;
    border:1px solid #1a233b;
    color:#e6edf3;
    padding:0.6rem;
    border-radius:10px;
    resize:vertical;
  }
  textarea:focus, input:focus {
    border-color:#ffaa00;
    outline:none;
    box-shadow:0 0 6px #ffaa0055;
  }
  button {
    border:none;
    background:#ffaa00;
    padding:0.6rem 1rem;
    border-radius:10px;
    margin-right:0.3rem;
    cursor:pointer;
    font-weight:bold;
  }
  #chatLog {
    height:220px;
    overflow-y:auto;
    background:#050a18;
    padding:0.7rem;
    border-radius:10px;
    border:1px solid #1a233b;
    white-space:pre-wrap;
    margin-bottom:0.6rem;
  }
</style>

</head>
<body>

<h1>Lucy</h1>

<div class="panel">
  <h2>Conversation</h2>
  <div id="chatLog">Lucy: Online and ready.</div>
  <textarea id="chatInput" placeholder="Say something to Lucy..."></textarea>
  <button onclick="sendMessage()">Send</button>
  <button onclick="clearChat()">Clear</button>
</div>

<div class="panel">
  <h2>Code Studio</h2>
  <textarea id="idea" placeholder="Ask Lucy to write a script (e.g. 'create a 5D STUR oscillator python script')"></textarea>
  <button onclick="generateLocalCode()">Create Script</button>

  <input id="filename" placeholder="filename.py">
  <textarea id="codeBox" placeholder="Lucy will put code here..."></textarea>
  <button onclick="downloadFile()">Download</button>
</div>

<script>

// Simple local-only Lucy (browser mode)
// Used until we attach the STUR backend kernel.

function sendMessage() {
  const msg = document.getElementById("chatInput").value.trim();
  if(!msg) return;

  append("You", msg);
  document.getElementById("chatInput").value = "";

  // Local Lucy “thinking”
  const reply = "I heard you say: '" + msg + "'. My STUR kernel is not connected yet, but I can already create scripts and store ideas.";
  append("Lucy", reply);
}

function append(who, text){
  const log = document.getElementById("chatLog");
  log.textContent += `\n${who}: ${text}`;
  log.scrollTop = log.scrollHeight;
}

function clearChat(){
  document.getElementById("chatLog").textContent = "Lucy: Ready again.";
}

// Local script generator
function generateLocalCode() {
  const idea = document.getElementById("idea").value.trim();
  if(!idea) return alert("Tell Lucy what to create.");

  const filename = guessFilename(idea);
  document.getElementById("filename").value = filename;

  const code =
`# Lucy's autogenerated script
# Description: ${idea}

def main():
    print("Lucy generated this script for: ${idea}")

if __name__ == "__main__":
    main()`;

  document.getElementById("codeBox").value = code;

  append("Lucy", "I drafted a script based on your description.");
}

function guessFilename(t) {
  t = t.toLowerCase();
  if(t.includes("python")) return "script.py";
  if(t.includes("html")) return "page.html";
  if(t.includes("js") || t.includes("javascript")) return "script.js";
  return "lucy_script.py";
}

function downloadFile() {
  const filename = document.getElementById("filename").value || "lucy_script.py";
  const text = document.getElementById("codeBox").value;
  if(!text) return alert("No code to download!");

  const blob = new Blob([text], {type: "text/plain"});
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();

  URL.revokeObjectURL(url);
}

</script>

</body>
</html>
