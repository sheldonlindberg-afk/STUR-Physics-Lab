<title>Page Not Found | STUR</title>
<script>
  // Old STUR v7 pages moved to /archive/v7-toe/. Redirect those URLs there.
  (function () {
    var p = location.pathname, m = p.match(/^(\/STUR-Physics-Lab\/)(.*)$/i);
    if (!m || /^archive\//i.test(m[2])) return;
    var rest = m[2];
    if (/^scripts\//i.test(rest) || /^tests\//i.test(rest) ||
        /^(about|mycitations|sitemap)\.html$/i.test(rest) || /\.md$/i.test(rest)) {
      location.replace(m[1] + 'archive/v7-toe/' + rest + location.search + location.hash);
    }
  })();
</script>
